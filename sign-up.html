<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to DormMate</title>
    <link rel="stylesheet" href="style.css">

    <style>


        .form-container {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 60px auto;
            padding: 30px;
            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 28px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .show-password {
            font-weight: normal;
            margin-bottom: 20px;
        }

        .show-password input {
            width: auto;
            margin: 0 5px 0 0;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #004085;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo-container">
            <div class="logo-box">OBU</div>
            <div class="logo">Ocean Bay University</div>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="#">About</a>
            <a href="#">Admissions</a>
            <a href="#">Academics</a>
            <a href="#">Students</a>
            <a href="#">Housing</a>
            <a href="signup.html">DormMate</a>
        </nav>
     </header>
    <div class="form-container">
        <h1>Welcome to DormMate!</h1>

        <form id="signup-form">
            <label for="username">Create Username</label>
            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required
            >

            <label for="password">Create Password</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
                required
            >

            <label class="show-password" for="show-password">
                <input type="checkbox" id="show-password">
                Show password
            </label>

            <button type="submit">Continue to Profile</button>
        </form>
    </div>

    <script>
        const password = document.getElementById("password");
        const checkbox = document.getElementById("show-password");

        checkbox.addEventListener("change", function () {
            password.type = checkbox.checked ? "text" : "password";
        });

        document.getElementById("signup-form")
            .addEventListener("submit", function (event) {
                event.preventDefault();
                window.location.href = "edit-profile.html";
            });
    </script>
</body>
</html>
